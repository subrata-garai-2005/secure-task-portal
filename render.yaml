services:
  - type: web
    name: secure-task-portal-api
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
